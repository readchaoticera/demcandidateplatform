# Human-reviewed corrections. Highest precedence of any evidence type.
#
# A person who has opened the page and read it is better evidence than any
# automated read of it, and this file is how that judgement survives the next
# re-run instead of being overwritten by it.
#
# Use it for what automation cannot reach:
#   - Javascript-rendered sites, where the served HTML carries no content
#   - positions stated in images, video or PDFs
#   - a classifier call that is simply wrong on inspection
#
# Do NOT use it to record something the classifier already gets right. An
# override masks future regressions in that row, so leaving correct rows to the
# classifier is what keeps the tests meaningful.
#
# Every entry needs a source a reader can check, and the reviewer's name, so a
# correction is as auditable as an automated classification.
#
# tier: one of explicit_m4a | single_payer_substance | public_option |
#            aca_strengthen | no_coverage_position | opposed

